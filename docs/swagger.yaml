components:
  schemas:
    github_com_akira-core_kube-state-graph_pkg_cytoscape.Body:
      properties:
        apiVersion:
          type: string
        clusters:
          items:
            type: string
          type: array
          uniqueItems: false
        elements:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.Elements'
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.Edge:
      properties:
        data:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.EdgeData'
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.EdgeData:
      properties:
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        metrics:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.EdgeMetricsDTO'
        source:
          type: string
        target:
          type: string
        type:
          type: string
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.EdgeMetricsDTO:
      description: 'Union of two disjoint measurement families. RED family (trace-derived
        call edges): rate (required within the family, > 0), error_rate, p90_server_ms.
        I/O family (pvc-to-netapp-aggr edges): read_ops, write_ops, read_latency_us,
        write_latency_us, read_bytes_per_sec, write_bytes_per_sec, plus the volume''s
        own QoS policy group''s declared ceiling, max_iops and max_bytes_per_sec (absent
        means no declared ceiling, never 0; neither appears without at least one measurement).
        A single edge carries fields from exactly one family. All values are JSON
        numbers rounded to 6 significant digits and may appear in exponent form (e.g.
        3.86e-7).'
      properties:
        error_rate:
          description: ErrorRate is the failed fraction in [0,1]. Omitted when the
            failure counter was unreadable; 0 means read successfully with no failures.
          example: 0.1
          type: number
        max_bytes_per_sec:
          description: MaxBytesPerSec is the declared throughput ceiling of the volume's
            own QoS policy group, converted from the policy's MB/s figure so it shares
            the unit of read_bytes_per_sec / write_bytes_per_sec.
          type: number
        max_iops:
          description: MaxIOPS is the declared ceiling of the volume's own QoS policy
            group, in requests per second. Absent means no declared ceiling — never
            0.
          type: number
        p90_server_ms:
          description: P90ServerMs is the 90th percentile server-observed request
            duration in milliseconds.
          example: 12.5
          type: number
        rate:
          description: Rate is requests per second over the window (always > 0 when
            the RED family is present). Schema-optional because the object is a union.
          example: 5
          type: number
        read_bytes_per_sec:
          type: number
        read_latency_us:
          type: number
        read_ops:
          type: number
        write_bytes_per_sec:
          type: number
        write_latency_us:
          type: number
        write_ops:
          type: number
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.Elements:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.Edge'
          type: array
          uniqueItems: false
        nodes:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.Node'
          type: array
          uniqueItems: false
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.Node:
      properties:
        data:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.NodeData'
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.NodeData:
      properties:
        application:
          type: string
        containers:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.Container'
          type: array
          uniqueItems: false
        health:
          type: string
        id:
          type: string
        ipaddress:
          items:
            type: string
          type: array
          uniqueItems: false
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        owner:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.Owner'
        parent:
          type: string
        ready_status:
          type: string
        storageclass:
          type: string
        type:
          type: string
        usage:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.UsageDTO'
      type: object
    github_com_akira-core_kube-state-graph_pkg_cytoscape.UsageDTO:
      properties:
        capacity_bytes:
          type: number
        used_bytes:
          type: number
      type: object
    github_com_akira-core_kube-state-graph_pkg_graph.Container:
      properties:
        image:
          type: string
        name:
          type: string
      type: object
    github_com_akira-core_kube-state-graph_pkg_graph.EdgeType:
      enum:
      - pod-mounts-pvc
      - pod-calls-pod
      - pod-calls-service
      - service-selects-pod
      - pod-to-node
      - pvc-to-netapp-aggr
      - storage-flow
      type: string
      x-enum-varnames:
      - EdgeTypePodMountsPVC
      - EdgeTypePodCallsPod
      - EdgeTypePodCallsService
      - EdgeTypeServiceSelectsPod
      - EdgeTypePodToNode
      - EdgeTypePVCToNetAppAggr
      - EdgeTypeStorageFlow
    github_com_akira-core_kube-state-graph_pkg_graph.EdgeTypeDefinition:
      properties:
        description:
          type: string
        directed:
          type: boolean
        labels:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.EdgeTypeLabel'
          type: array
          uniqueItems: false
        may_cross_cluster:
          type: boolean
        source_type:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.NodeType'
          type: array
          uniqueItems: false
        target_type:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.NodeType'
          type: array
          uniqueItems: false
        type:
          $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.EdgeType'
      type: object
    github_com_akira-core_kube-state-graph_pkg_graph.EdgeTypeLabel:
      properties:
        description:
          type: string
        name:
          type: string
        value_type:
          type: string
      type: object
    github_com_akira-core_kube-state-graph_pkg_graph.NodeType:
      enum:
      - pod
      - node
      - pvc
      - service
      - external
      - netapp-aggr
      - netapp-node
      - netapp-svm
      type: string
      x-enum-varnames:
      - NodeTypePod
      - NodeTypeK8sNode
      - NodeTypePVC
      - NodeTypeService
      - NodeTypeExternal
      - NodeTypeNetAppAggr
      - NodeTypeNetAppNode
      - NodeTypeNetAppSVM
    github_com_akira-core_kube-state-graph_pkg_graph.Owner:
      properties:
        kind:
          type: string
        name:
          type: string
      type: object
    internal_api.edgeTypesBody:
      properties:
        apiVersion:
          type: string
        edge_types:
          items:
            $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_graph.EdgeTypeDefinition'
          type: array
          uniqueItems: false
      type: object
    internal_api.errorBody:
      properties:
        apiVersion:
          type: string
        error:
          $ref: '#/components/schemas/internal_api.errorField'
      type: object
    internal_api.errorField:
      properties:
        message:
          type: string
        reason:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: API key presented in the `X-API-Key` header. Required on `/v1/*`
        when the server is started with keys configured. Health, metrics, and docs
        routes are exempt.
      in: header
      name: X-API-Key
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    Multi-cluster pod / node / PVC graph API. Reads kube-state-metrics and pod-UID-resolved service-graph metrics from a centralised VictoriaMetrics and returns the joined cross-cluster graph as Cytoscape.js JSON.

    **Authentication.** When the server is started with API keys configured (`--api-keys-file` or `--api-keys`), every request to `/v1/*` MUST carry an `X-API-Key: <key>` header. Missing or invalid keys yield `401 Unauthorized`. Health probes (`/livez`, `/readyz`), the metrics endpoint (`/metrics`), and the OpenAPI / Scalar UI routes (`/openapi.*`, `/docs`) are exempt and require no key.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: kube-state-graph API
  version: v1
openapi: 3.1.0
paths:
  /docs:
    get:
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: HTML
      summary: API reference UI (Scalar)
      tags:
      - docs
  /livez:
    get:
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
      summary: Liveness
      tags:
      - health
  /openapi.json:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OpenAPI 3.1 JSON
      summary: OpenAPI spec (JSON)
      tags:
      - docs
  /openapi.yaml:
    get:
      responses:
        "200":
          content:
            application/yaml:
              schema:
                type: string
          description: OpenAPI 3.1 YAML
      summary: OpenAPI spec (YAML)
      tags:
      - docs
  /readyz:
    get:
      description: Returns 200 only when an `up{}` probe against every configured
        upstream backend succeeds within --api-timeout. With no routing table configured
        there is exactly one implicit backend, so the behaviour is unchanged.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
        "503":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Service Unavailable
      summary: Readiness
      tags:
      - health
  /v1/edge-types:
    get:
      description: |-
        Static catalogue of edge types this server can produce — directionality, valid source/target node types, supported labels, and whether the edge may cross cluster boundaries. No upstream calls; served with `Cache-Control: public, max-age=3600`. Use this to validate the `edge_type` filter on `/v1/graph` and to drive UI legends.

        <details><summary><b>Edge type matrix</b></summary>

        | type | source → target | directed | cross-cluster |
        |---|---|---|---|
        | `pod-mounts-pvc` | pod → pvc | yes | no |
        | `pod-calls-pod` | pod \| service \| external → pod \| external | yes | yes |
        | `pod-calls-service` | pod \| service \| external → service | yes | yes |
        | `service-selects-pod` | service → pod | yes | yes |

        An ingress entry-point `service` node carries `labels.role`: `ingress-gateway` (chain entry hop; gateway pods and a synthesized `pod-calls-service` hop to the backend exist behind it) or `ingress-lb` (ingress LB fallback destination, no routed backend).

        A call endpoint whose pod UID is empty and whose `client`/`server` label is a `://` connection string is resolved (detection hardcoded, no operator knob) against every loaded cluster in the caller's family (cluster names equal after normalising digit runs; anchored on the UID-recovered client-pod cluster when available, else the trace-source label): each surviving family cluster holding the addressed Service yields a `service` node and a `pod-calls-service` edge (which may therefore cross clusters). Candidates provably without backing pods (zero endpoints in an endpoint-visible cluster) are pruned when an endpoint-backed sibling exists; an anchor naming no loaded family falls back to the single loaded family holding the Service (multi-family names are ambiguous and stay external). Zero surviving candidates yield an `external` node. A non-URL missing-UID label resolves to an `external` node. `service-selects-pod` edges are materialised on demand from `service` nodes to their own cluster's backing pods.

        </details>
      parameters:
      - description: API key. Required when the server is started with API keys configured.
        in: header
        name: X-API-Key
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.edgeTypesBody'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Missing or invalid `X-API-Key` (only when API key auth is configured)
      security:
      - ApiKeyAuth: []
      summary: Edge-type catalogue
      tags:
      - discovery
  /v1/graph:
    get:
      description: |-
        Returns the joined multi-cluster pod / node / PVC graph for the supplied `[start, end]` window in Cytoscape.js JSON shape (`{ elements: { nodes:[…], edges:[…] } }`).

        **Window**: `start`/`end` accept RFC 3339 or Unix seconds. Only `end > start` is enforced; the pair is passed through to upstream PromQL verbatim. Bounded query cost is delegated to upstream VictoriaMetrics search limits. Each request triggers a fresh fan-out — there is no in-process result cache.

        **Filters** (all repeatable; AND across param names, OR within a single name): `cluster`, `namespace`, `edge_type`, `name`. The `name` filter matches `n.Name()` exactly across every node type (pod, K8s node, PVC, service, external, netapp-aggr, netapp-node).

        **Traversal** (set `root` to enable): `depth` 0..6 (default 2), `direction` `in`/`out`/`both` (default `both`).

        **Node types**: `pod`, `node`, `pvc`, `service`, `external`, `netapp-aggr`, `netapp-node`, plus the presentation-only `cluster`, `storage-cluster`, `namespace`, `application` and `controller` compound group nodes synthesised by the Cytoscape serialiser (`cluster > namespace > application > controller > pod`, with absent levels skipped; `cluster > namespace > [application >] {service, pvc}`; `cluster > node`; `storage-cluster > netapp-node > netapp-aggr`, where the real `netapp-node` is the compound parent of its aggregates). **Edge types**: `pod-mounts-pvc`, `pod-calls-pod`, `pod-calls-service`, `service-selects-pod`, `pod-to-node`, `pvc-to-netapp-aggr`. An ingress entry-point `service` node additionally carries `labels.role` — `ingress-gateway` (a routed hit's chain entry; gateway pods and a synthesized `pod-calls-service` hop to the backend exist behind it) or `ingress-lb` (the ingress LB fallback destination; no routed backend). The key is absent on every other service node.

        **Edge `data.metrics`**: a union of two disjoint families. RED (trace-derived call edges): `rate` (req/s, required within the family), `error_rate`, `p90_server_ms`. I/O (`pvc-to-netapp-aggr` edges): `read_ops`, `write_ops`, `read_latency_us`, `write_latency_us`, `read_bytes_per_sec`, `write_bytes_per_sec` from Harvest, verbatim. Schema-level every field is optional (rate moved off `required`); a RED object always carries a positive `rate`. All values are JSON numbers rounded to 6 significant digits and MAY appear in exponent form. The key is omitted entirely when the edge has no measurements.

        **Endpoint resolution**: for a call endpoint whose pod UID is empty, the `client`/`server` label is inspected for a `://` connection string (no operator knob — detection is hardcoded). When present, the URL host is parsed (an optional `.svc.<domain>` suffix is stripped): both a `<service>.<namespace>` host and a headless `<pod>.<service>.<namespace>` host resolve to the addressed `(namespace, service)`. Resolution is anchored on ONE cluster — the UID-recovered client-pod cluster when available, else the trace-source label — and succeeds only when that cluster itself holds the same-named Service; a family sibling holding it is not enough, and there is no cross-family fallback, so this path is always intra-cluster. It materialises a single `service` node (`<cluster>/<ns>/<service>`) and one `pod-calls-service` edge. From that node, on-demand `service-selects-pod` edges fan out to the backing pods of EVERY same-family cluster holding the same-named Service (cluster names equal after normalising digit runs), so those edges MAY cross clusters; there is no endpoint-backed pruning — a sibling with zero endpoints simply contributes none. A `server="unknown"` endpoint whose client resolved to a real pod is instead classified from its peer address (in-cluster DNS name, bare short Service name in the client pod's namespace, or a ClusterIP literal looked up in the client's own cluster) and resolves under the same anchor rule. When the optional Istio route engine is configured, a global/ingress FQDN that would otherwise fall through resolves to the Service the selected ingress cluster's Gateway + VirtualService config routed it to — that cluster may be a family sibling of the caller's, so the resulting `pod-calls-service` edge MAY cross clusters, and the ingress entry point's own fan-out is locked to the selected cluster's endpoints. Anything unresolved yields an `external` node (`external/<value>`), as does a non-URL missing-UID label. Calls whose target is not a service stay typed `pod-calls-pod`. See `/v1/edge-types` for the authoritative per-type catalogue.

        Example: `GET /v1/graph?start=2026-05-05T11:00:00Z&end=2026-05-05T12:00:00Z&cluster=prod-eu&namespace=payments&edge_type=pod-calls-pod`

        <details><summary><b>Sample response</b></summary>

        ```json
        {
        "apiVersion": "v1",
        "clusters": ["prod-eu", "prod-us"],
        "elements": {
        "nodes": [
        { "data": { "id": "prod-eu/8f8d4f1a-...-89ab", "type": "pod",  "name": "checkout-7d9f6c8b8-abcde", "owner": { "kind": "Deployment", "name": "checkout" }, "application": "checkout", "containers": [ { "name": "app", "image": "reg.example/checkout:1.4" }, { "name": "istio-proxy", "image": "reg.example/proxy:0.9" } ], "labels": { "cluster": "prod-eu", "namespace": "payments" } } },
        { "data": { "id": "prod-eu/ip-10-0-1-23",     "type": "node", "name": "ip-10-0-1-23.ec2.internal", "labels": { "cluster": "prod-eu" } } }
        ],
        "edges": [
        { "data": { "id": "...uuidv5...", "type": "pod-calls-pod",   "source": "prod-eu/8f8d4f1a-...-89ab", "target": "prod-us/a1b2c3d4-...-7654", "labels": { "cluster": "prod-eu" }, "metrics": { "rate": 5, "error_rate": 0.1, "p90_server_ms": 12.5 } } }
        ]
        }
        }
        ```

        </details>
      parameters:
      - description: Window start. RFC 3339 (`2026-05-05T11:00:00Z`) or Unix seconds
          (`1746442800`).
        example: "2026-05-05T11:00:00Z"
        in: query
        name: start
        required: true
        schema:
          type: string
      - description: Window end. RFC 3339 or Unix seconds. Must be > start.
        example: "2026-05-05T12:00:00Z"
        in: query
        name: end
        required: true
        schema:
          type: string
      - description: Restrict to listed clusters (repeatable, OR-combined). Pushed
          into every cluster-labelled upstream query. The value `unknown` addresses
          series carrying no `cluster` label.
        example: prod-eu
        in: query
        name: cluster
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Restrict to listed Kubernetes namespaces (repeatable, OR-combined).
          Pushed into every namespace-labelled upstream query; nodes and NetApp aggregates
          follow by reference.
        example: payments
        in: query
        name: namespace
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Restrict to listed availability zones (repeatable, OR-combined).
          Pushed into every topology query as a matcher on the deployment's configured
          zone label (default `az`, see --az-label).
        example: eu-west-1a
        in: query
        name: az
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Restrict to listed environments (repeatable, OR-combined). Pushed
          into every topology query as a matcher on the deployment's configured environment
          label (default `env`, see --env-label).
        example: prod
        in: query
        name: env
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Restrict to listed edge types. Repeatable, OR-combined.
        example: pod-calls-pod
        in: query
        name: edge_type
        schema:
          items:
            enum:
            - pod-mounts-pvc
            - pod-calls-pod
            - pod-calls-service
            - service-selects-pod
            - pod-to-node
            - pvc-to-netapp-aggr
            type: string
          type: array
        style: form
      - description: 'Keep only workload on a connectivity edge (the default). `false`
          returns the inventory instead: every loaded pod with its node / PVC / NetApp
          chain, plus unreferenced infrastructure when no cluster or namespace filter
          narrows it.'
        example: true
        in: query
        name: prune
        schema:
          default: true
          type: boolean
      - description: API key. Required when the server is started with API keys configured.
        in: header
        name: X-API-Key
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_akira-core_kube-state-graph_pkg_cytoscape.Body'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Invalid parameters (missing/invalid start|end, invalid_range,
            invalid_scope, outside_retention)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Missing or invalid `X-API-Key` (only when API key auth is configured)
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Upstream VictoriaMetrics returned an error (RFC 9110 §15.6.3)
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorBody'
          description: Build exceeded --build-timeout (RFC 9110 §15.6.5)
      security:
      - ApiKeyAuth: []
      summary: Get multi-cluster graph (Cytoscape.js)
      tags:
      - graph
servers:
- url: /
