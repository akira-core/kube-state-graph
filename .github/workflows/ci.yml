name: CI

# `lint`, `vuln`, `test`, `docs-drift`, `route-containment`, and `mocks-drift`
# are separate jobs; they run in parallel (no `needs` edges) so PR feedback
# latency = max, not sum.
on:
  pull_request:
  # Also run on direct pushes / merges to the default branch so post-merge
  # regressions (direct pushes, force-pushes, stale-base merges) get a fresh
  # signal and `main` carries a build status.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The route-engine e2e (internal/integration TestRouteSuite) needs Envoy's
      # native router_check_tool. Without it the suite used to Skipf — which
      # prints as `ok`, so every route-engine regression merged green. It now
      # Fatalf's whenever CI is set, and this step is what keeps that green:
      # the binary comes from the SAME digest-pinned image the server image
      # ships (single source: the Dockerfile ARG the Makefile reads).
      - name: Install router_check_tool
        run: make router-check-tool

      - name: Export router_check_tool path
        run: echo "KSG_ROUTER_CHECK_BIN=$PWD/bin/router_check_tool" >> "$GITHUB_ENV"

      # Runs under Go's default 10m per-package timeout: the container-backed
      # suites in internal/integration seed their fixtures once per suite and
      # run in parallel, which keeps the package well inside it. Restore an
      # explicit -timeout only if that stops being true — the default aborts
      # with a goroutine dump rather than a clean failure.
      - name: Run unit + integration tests
        run: make test

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pre-download modules so `swag init` does not race the module cache
      # while parsing transitive deps; without this the CI runner hits
      # "cannot find all dependencies" and swag exits 1.
      - name: Pre-download modules
        run: go mod download

      # Single source of truth: `make check-docs` regenerates the OpenAPI spec
      # via the `swag` tool pinned in go.mod (`tool` directive) and diffs the
      # committed docs/ spec (embedded into the binary via docs/embed.go).
      - name: Verify docs in sync
        run: make check-docs

  # Dependency containment (translate-global-fqdn-to-k8s-service D1): pkg/build
  # declares only the RouteResolver interface, pkg/route holds the engine. A
  # future pkg/build -> pkg/route import would make every embedder of the graph
  # engine inherit istio + ClickHouse + Envoy protos. The check lived only in
  # `make ci` until now, so the guarantee CLAUDE.md documents was not actually
  # enforced anywhere.
  route-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify route-engine containment
        run: make check-route-containment

  mocks-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Pre-download modules
        run: go mod download

      # Mockery is pinned via the go.mod `tool` directive and invoked through
      # `go tool mockery`, so no separate install step is needed.
      - name: Verify mocks in sync
        run: make verify-mocks
